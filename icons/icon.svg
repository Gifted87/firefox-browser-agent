<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#shieldGrad)" stroke="url(#cyberGrad)" stroke-width="3"/>
  
  <!-- Inner Circuit Grid Accent -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#312e81" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Central Agent Core -->
  <polygon points="64,28 92,44 92,76 64,96 36,76 36,44" fill="url(#cyberGrad)" opacity="0.15" stroke="url(#cyberGrad)" stroke-width="2"/>
  
  <!-- Dynamic ReAct Node Loops -->
  <circle cx="64" cy="40" r="6" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="84" cy="74" r="6" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="44" cy="74" r="6" fill="#6366f1" filter="url(#glow)"/>
  
  <!-- Connecting Synapse Lines -->
  <line x1="64" y1="40" x2="84" y2="74" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="84" y1="74" x2="44" y2="74" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="74" x2="64" y2="40" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center Brain Spark -->
  <circle cx="64" cy="62" r="5" fill="#ffffff" filter="url(#glow)"/>
</svg>
